// =====================================================
// CANVAS

const canvas =

// =====================================================
// CONTROLLER INPUT

let input = {

direction:"CENTER",

jump:false,

fly:false,

reset:false,

pause:false,

center:false

};

jump:false,

fly:false,

reset:false,

};


// =====================================================
// GAME STATE
// =====================================================

let state = "START";
let gameMode = "EASY";
const EASY_SPEED = 1.60;
const HARD_SPEED = 1.80;
let score = 0;
let lives = 3;
let pizzaCount = 0;
let pizzasCollectedTotal = 0;
let coinsCollected = 0;
let distanceScore = 0;
let highScore = Number(localStorage.getItem("nexusHighScore") || 0);
let leaderboard = JSON.parse(localStorage.getItem("nexusLeaderboard") || "[]");

// =====================================================
// SOUND
// =====================================================

let audioContext = null;


function beep(

frequency = 600,

duration = 0.08

){

try{

audioContext =
audioContext ||

new(
window.AudioContext ||
window.webkitAudioContext
)();


let oscillator =
audioContext.createOscillator();


let gain =
audioContext.createGain();


oscillator.type = "square";

oscillator.frequency.value =
frequency;


gain.gain.value = 0.035;


oscillator.connect(gain);

gain.connect(
audioContext.destination
);


oscillator.start();


gain.gain.exponentialRampToValueAtTime(

0.001,

audioContext.currentTime +
duration

);


oscillator.stop(

audioContext.currentTime +
duration

);

}

catch(e){

}

}


// =====================================================
// READ ESP8266 CONTROLLER
// =====================================================

let relaySocket = null;
let relayTimer = null;

function relayURL(){
  return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/ws";
}

function connectRelay(){
  try{
    if(relaySocket) relaySocket.close();
    relaySocket = new WebSocket(relayURL());

    relaySocket.onopen = () => {
      relaySocket.send(JSON.stringify({type:"controller_request"}));
      if(relayTimer) clearInterval(relayTimer);
      relayTimer = setInterval(() => {
        if(relaySocket && relaySocket.readyState === WebSocket.OPEN){
          relaySocket.send(JSON.stringify({type:"controller_request"}));
        }
      }, 70);
    };

    relaySocket.onmessage = (event) => {
      try{
        const msg = JSON.parse(event.data);
        if(msg.type === "controller" && msg.data){
          input = msg.data;
        }
      }catch(e){}
    };

    relaySocket.onclose = () => {
      if(relayTimer){ clearInterval(relayTimer); relayTimer = null; }
      setTimeout(connectRelay, 2000);
    };
  }catch(e){
    setTimeout(connectRelay, 2000);
  }
}

connectRelay();


// =====================================================
// BUTTON EDGE DETECTION
// =====================================================

function pressed(button){

return (

input[button] === true &&

previous[button] !== true

);

}

// =====================================================

{x:0,y:235,w:260,h:35},{x:290,y:215,w:170,h:55},{x:500,y:190,w:150,h:80},
{x:690,y:220,w:170,h:50},{x:900,y:180,w:150,h:90},{x:1090,y:215,w:170,h:55},
{x:1300,y:185,w:180,h:85},{x:1510,y:220,w:160,h:50},{x:1710,y:175,w:190,h:95},
{x:1940,y:210,w:170,h:60},{x:2150,y:180,w:180,h:90},{x:2380,y:220,w:180,h:50},
{x:2600,y:175,w:180,h:95},{x:2830,y:205,w:170,h:65},{x:3040,y:160,w:200,h:110},
{x:3290,y:215,w:180,h:55},{x:3520,y:180,w:190,h:90},{x:3760,y:220,w:180,h:50},
{x:3990,y:165,w:200,h:105},{x:4240,y:210,w:180,h:60},{x:4470,y:180,w:190,h:90},
{x:4710,y:220,w:190,h:50},{x:4950,y:175,w:220,h:95},{x:5220,y:205,w:240,h:65},
{x:5520,y:190,w:220,h:80},{x:5800,y:220,w:300,h:50}
];

let coins = [];
for(let i=0;i<115;i++){ coins.push({x:80+i*50,y:125-(i%5)*14,collected:false}); }

let pizzas = [
{x:360,y:175,collected:false},{x:1020,y:145,collected:false},{x:1560,y:175,collected:false},
{x:2220,y:145,collected:false},{x:2860,y:170,collected:false},{x:3500,y:145,collected:false},
{x:4140,y:150,collected:false},{x:4750,y:175,collected:false},{x:5150,y:155,collected:false},{x:5650,y:150,collected:false}
];

let enemies = [
{x:620,y:165,width:18,height:25,vx:0.55,min:540,max:790,dir:1},
{x:1160,y:185,width:18,height:25,vx:0.48,min:1110,max:1260,dir:1},
{x:1760,y:145,width:18,height:25,vx:0.52,min:1690,max:1870,dir:1},
{x:2360,y:190,width:18,height:25,vx:0.50,min:2290,max:2500,dir:-1},
{x:3000,y:135,width:18,height:25,vx:0.58,min:2930,max:3200,dir:1},
{x:3650,y:155,width:18,height:25,vx:0.55,min:3570,max:3740,dir:-1},
{x:4300,y:185,width:18,height:25,vx:0.50,min:4230,max:4400,dir:1},
{x:4870,y:150,width:18,height:25,vx:0.58,min:4760,max:5050,dir:-1}
];

// =====================================================
// COLLISION
// =====================================================

function collision(a,b){

return(

a.x < b.x + b.width &&

a.x + a.width > b.x &&

a.y < b.y + b.height &&

a.y + a.height > b.y

);

}


// =====================================================
// RESET / LEADERBOARD
// =====================================================

function saveRun(){
  const entry={score:score,coins:coinsCollected,distance:Math.floor(gameDistance)};
  leaderboard.push(entry);
  leaderboard.sort((a,b)=>b.score-a.score);
  leaderboard=leaderboard.slice(0,5);
  localStorage.setItem("nexusLeaderboard",JSON.stringify(leaderboard));
  if(score>highScore){ highScore=score; localStorage.setItem("nexusHighScore",highScore); }
}

function leaderboardHTML(){
  let h="<br><b>LEADERBOARD</b><br>";
  if(!leaderboard.length) return h+"No runs yet";
  leaderboard.forEach((r,i)=>{ h+=(i+1)+". "+r.score+" pts | "+r.coins+" coins | "+r.distance+"m<br>"; });
  return h;
}

function resetGame(){
  state="PLAYING"; score=0; lives=3; pizzaCount=0; pizzasCollectedTotal=0; coinsCollected=0; distanceScore=0;
  flightUnlocked=false; flying=false; flightTime=0; laserTime=0; lasers=[]; bossLasers=[]; cameraX=0; gameDistance=0; lastShot=0; lastBossShot=0;
  player.x=45; player.y=100; player.vx=0; player.vy=0; player.onGround=false;
  coins.forEach(c=>c.collected=false); pizzas.forEach(p=>p.collected=false);
  enemies=[
    {x:620,y:165,width:18,height:25,vx:0.55,min:540,max:790,dir:1},{x:1160,y:185,width:18,height:25,vx:0.48,min:1110,max:1260,dir:1},
    {x:1760,y:145,width:18,height:25,vx:0.52,min:1690,max:1870,dir:1},{x:2360,y:190,width:18,height:25,vx:0.50,min:2290,max:2500,dir:-1},
    {x:3000,y:135,width:18,height:25,vx:0.58,min:2930,max:3200,dir:1},{x:3650,y:155,width:18,height:25,vx:0.55,min:3570,max:3740,dir:-1},
    {x:4300,y:185,width:18,height:25,vx:0.50,min:4230,max:4400,dir:1},{x:4870,y:150,width:18,height:25,vx:0.58,min:4760,max:5050,dir:-1}
  ];
  if(gameMode === "HARD"){
    enemies.push(
      {x:850,y:185,width:18,height:25,vx:0.52,min:810,max:900,dir:1},
      {x:2050,y:180,width:18,height:25,vx:0.54,min:1980,max:2110,dir:-1},
      {x:3970,y:135,width:18,height:25,vx:0.56,min:3890,max:4070,dir:1}
    );
  }
  boss={
    x:5400,y:140,width:58,height:65,
    hp:gameMode==="HARD"?10:5,
    maxHp:gameMode==="HARD"?10:5,
    active:false,defeated:false,
    vx:gameMode==="HARD"?0.55:0.45,
    dir:1
  };
  hideMessage(); beep(700,0.1); updateHUD();
}

function gameOver(){ saveRun(); state="GAMEOVER"; updateHUD(); showMessage("GAME OVER","SCORE: "+score+"<br>COINS: "+coinsCollected+"<br>DISTANCE: "+Math.floor(gameDistance)+"m"+leaderboardHTML()+"<br><br>PRESS D5 TO RESET"); }

function victory(){
  if(state!=="PLAYING") return;
  state="VICTORY"; saveRun(); beep(1200,0.25);
  showMessage("BOSS DEFEATED","FINAL SCORE: "+score+"<br>COINS: "+coinsCollected+"<br>DISTANCE: "+Math.floor(gameDistance)+"m"+leaderboardHTML()+"<br><br>PRESS D5 TO RESET");
}

function hitPlayer(){
  if(flying) return;
  lives--; beep(150,0.15);
  if(lives<=0){ gameOver(); return; }
  player.x=Math.max(45,player.x-150); player.y=100; player.vx=0; player.vy=0; updateHUD();
}

function shootLaser(){
  if(state!=="PLAYING" || laserTime<=0) return;
  const now=performance.now(); if(now-lastShot<260) return; lastShot=now;
  lasers.push({x:player.x+player.width,y:player.y+12,width:90,height:4,w:90,h:4,life:18}); beep(1050,0.04);
}

function update(){
  if(pressed("reset")){
    resetGame();
    previous=Object.assign({},input);
    return;
  }

  if(pressed("center")){
    if(state !== "START"){
      state="START";
      hideMessage();
      player.x=45; player.y=100; player.vx=0; player.vy=0;
      flying=false; laserTime=0; lasers=[]; bossLasers=[]; lastBossShot=0;
      updateHUD();
    }
    previous=Object.assign({},input);
    return;
  }

  if(state === "START"){
    if(pressed("jump")){
      gameMode = gameMode === "EASY" ? "HARD" : "EASY";
      beep(gameMode === "HARD" ? 850 : 500,0.08);
      updateHUD();
    }
    previous=Object.assign({},input);
    return;
  }

  if(pressed("pause")){
    if(state==="PLAYING"){state="PAUSED";showMessage("GAME PAUSED","D6 PAUSE / RESUME");}
    else if(state==="PAUSED"){state="PLAYING";hideMessage();}
    previous=Object.assign({},input); return;
  }

  if(state!=="PLAYING"){ previous=Object.assign({},input); return; }

  if(input.direction==="LEFT") player.vx=gameMode==="HARD"?-HARD_SPEED:-EASY_SPEED;
  else if(input.direction==="RIGHT") player.vx=gameMode==="HARD"?HARD_SPEED:EASY_SPEED;
  else player.vx*=0.78;

  if(pressed("fly")){
    if(laserTime>0){
      shootLaser();
    }
    else if(flightUnlocked && !flying){
      flying=true;
      flightTime=720;
      beep(850,0.1);
    }
  }
  if(flying){
    flightTime-=16; player.vy=-0.20;
    if(input.direction==="RIGHT") player.vx=gameMode==="HARD"?3.00:2.10; else if(input.direction==="LEFT") player.vx=gameMode==="HARD"?-3.00:-2.10;
    if(flightTime<=0){flying=false;flightTime=0;beep(250,0.1);}
  } else player.vy+=0.42;

  if(pressed("jump") && player.onGround && !flying){player.vy=-7.4;beep(500,0.08);}
  player.x+=player.vx; player.y+=player.vy;
  if(player.x<0) player.x=0;

  player.onGround=false;
  if(!flying){for(const platform of platforms){if(player.x<platform.x+platform.w && player.x+player.width>platform.x && player.y+player.height>=platform.y && player.y+player.height<=platform.y+18 && player.vy>=0){player.y=platform.y-player.height;player.vy=0;player.onGround=true;}}}

  for(const coin of coins){if(!coin.collected && collision(player,{x:coin.x,y:coin.y,width:12,height:12})){coin.collected=true;coinsCollected++;score+=25;beep(900,0.035);}}

  for(const pizza of pizzas){
    if(!pizza.collected && collision(player,{x:pizza.x,y:pizza.y,width:16,height:14})){
      pizza.collected=true; pizzaCount++; pizzasCollectedTotal++; score+=150; beep(1100,0.08);
      if(pizzasCollectedTotal>=4) flightUnlocked=true;
      if(pizzaCount>=2){
        pizzaCount-=2; laserTime=600; score+=25; beep(1350,0.12);
        showMessage("LASER READY","10 SEC - PRESS D4 TO FIRE"); setTimeout(()=>{if(state==="PLAYING") hideMessage();},900);
      }
    }
  }

  if(laserTime>0) laserTime-=1;
  for(const l of lasers){l.x+=6;l.life--;} lasers=lasers.filter(l=>l.life>0);

  for(const enemy of enemies){
    enemy.x += enemy.vx*enemy.dir*(gameMode === "HARD" ? 1.15 : 1);
    if(enemy.x<enemy.min){enemy.x=enemy.min;enemy.dir=1;} if(enemy.x>enemy.max){enemy.x=enemy.max;enemy.dir=-1;}
    if(collision(player,{x:enemy.x,y:enemy.y,width:enemy.width,height:enemy.height})&&!flying) hitPlayer();
    for(const l of lasers){if(collision(l,{x:enemy.x,y:enemy.y,width:enemy.width,height:enemy.height})){enemy.dead=true;l.life=0;score+=10;beep(700,0.06);}}
  }
  enemies=enemies.filter(e=>!e.dead);

  // Final boss zone: enter at 5400, fight with the 10-second laser windows.
  if(player.x>5200) boss.active=true;
  if(boss.active&&!boss.defeated){
    boss.y=145+Math.sin(performance.now()/350)*35;
    boss.x+=boss.vx*boss.dir;
    if(boss.x<5310||boss.x>5550) boss.dir*=-1;

    // Player laser hits boss: one hit removes one HP.
    for(const l of lasers){
      if(collision(l,{x:boss.x,y:boss.y,width:boss.width,height:boss.height})){
        l.life=0;
        boss.hp--;
        score+=5;
        beep(780,0.05);
      }
    }

    // Final boss fires a slow laser periodically.
    const now=performance.now();
    if(now-lastBossShot>=1800){
      lastBossShot=now;
      bossLasers.push({
        x:boss.x-70,
        y:boss.y+30,
        w:70,
        h:4,
        vx:-2.0,
        life:180
      });
    }

    // Move boss lasers and damage player.
    for(const bl of bossLasers){
      bl.x+=bl.vx;
      bl.life--;
      if(collision(player,{x:bl.x,y:bl.y,width:bl.w,height:bl.h})){
        bl.life=0;
        hitPlayer();
      }
    }
    bossLasers=bossLasers.filter(bl=>bl.life>0);

    if(boss.hp<=0){
      boss.defeated=true;
      bossLasers=[];
      score+=100;
      victory();
    }

    if(collision(player,{x:boss.x,y:boss.y,width:boss.width,height:boss.height})&&!flying) hitPlayer();
  }

  if(player.y>330) hitPlayer();
  gameDistance=Math.max(gameDistance,player.x);
  distanceScore=Math.floor(gameDistance/10);
  score=Math.max(score,coinsCollected*25+distanceScore+pizzasCollectedTotal*150+(boss.defeated?100:0));
  cameraX=Math.max(0,player.x-110);

  previous=Object.assign({},input); updateHUD();
}

// =====================================================

function updateHUD(){
  document.getElementById("score").textContent=score;
  document.getElementById("high").textContent=highScore;
  document.getElementById("coins").textContent=coinsCollected;
  document.getElementById("distance").textContent=Math.floor(gameDistance);
  document.getElementById("lives").textContent=lives;
  document.getElementById("pizza").textContent=pizzaCount;
  if(state==="PLAYING") document.getElementById("status").textContent=laserTime>0?"LASER "+Math.ceil(laserTime/60)+"s":(boss.active?"BOSS":"PLAYING");
  else if(state==="START") document.getElementById("status").textContent="MODE "+gameMode;
  else document.getElementById("status").textContent=state;
}

// =====================================================

// =====================================================
// ENEMIES
// =====================================================

function drawEnemies(){

for(

const enemy of enemies

){

if(enemy.dead) continue;

let x =

enemy.x - cameraX;


ctx.fillStyle = "#9b3aa3";

ctx.fillRect(

x,

enemy.y,

18,

25

);


ctx.fillStyle = "#ffe66d";

ctx.fillRect(

x + 3,

enemy.y + 5,

4,

4

);


ctx.fillRect(

x + 11,

enemy.y + 5,

4,

);

}

}


// =====================================================
// LASERS + BOSS
// =====================================================

function drawCombat(){
  for(const l of lasers){
    const x=l.x-cameraX; ctx.fillStyle="#ff4040"; ctx.fillRect(x,l.y,Math.min(l.width,55),4);
    ctx.fillStyle="#ffffff"; ctx.fillRect(x,l.y+1,Math.min(l.width,48),2);
  }
  for(const bl of bossLasers){
    const x=bl.x-cameraX;
    ctx.fillStyle="#ff9f1c";
    ctx.fillRect(x,bl.y,bl.w,bl.h);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(x+5,bl.y+1,Math.max(1,bl.w-10),2);
  }
  if(boss.active&&!boss.defeated){
    const x=boss.x-cameraX;
    ctx.fillStyle="#7d1f2f"; ctx.fillRect(x,boss.y,boss.width,boss.height);
    ctx.fillStyle="#ffcc33"; ctx.fillRect(x+8,boss.y+12,10,10); ctx.fillRect(x+40,boss.y+12,10,10);
    ctx.fillStyle="#ef4444"; ctx.fillRect(x+10,boss.y-12,38,6);
    ctx.fillStyle="#55ff55"; ctx.fillRect(x+10,boss.y-10,38*(boss.hp/boss.maxHp),3);
    ctx.fillStyle="#fff"; ctx.font="10px monospace"; ctx.fillText("BOSS",x+12,boss.y+58);
  }
}

// =====================================================
// DRAW
// =====================================================

function draw(){

if(state === "START"){

drawStart();

return;

}


drawBackground();

drawPlatforms();

drawCoins();

drawPizzas();

drawEnemies();

drawCombat();

drawPlayer();


ctx.fillStyle = "#ffffff";

ctx.font =

"12px monospace";


ctx.fillText(

"NEXUS ZONE",

10,

20

);

}


// =====================================================
// MAIN GAME LOOP
// =====================================================

function gameLoop(){

update();

draw();

requestAnimationFrame(gameLoop);

}


updateHUD();

gameLoop();

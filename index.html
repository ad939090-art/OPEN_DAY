<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>NEXUS RACCOON</title>

<style>

*{
box-sizing:border-box;
}

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#080b16;
color:white;

font-family:monospace;

overflow:hidden;

}

body{

display:flex;
align-items:center;
justify-content:center;

}

#container{

width:96vw;
max-width:900px;

text-align:center;

}

#hud{

display:flex;

justify-content:space-between;

flex-wrap:wrap;

gap:6px;

padding:8px;

background:#151a2d;

border:3px solid #39456d;

border-radius:10px;

font-size:13px;

font-weight:bold;

}

#hud span{

color:#ffe45c;

}

canvas{

display:block;

width:100%;

height:auto;

margin-top:8px;

border:5px solid #39456d;

border-radius:10px;

background:#111827;

image-rendering:pixelated;

box-shadow:0 0 25px #000;

}

#controls{

margin-top:6px;

font-size:11px;

color:#bfc7e8;

}

#message{

position:fixed;

left:50%;

top:50%;

transform:translate(-50%,-50%);

background:#101522;

border:4px solid #ffe45c;

border-radius:12px;

padding:22px;

min-width:280px;

display:none;

z-index:10;

font-size:17px;

line-height:1.6;

box-shadow:0 0 30px #000;

}

</style>

</head>


<body>


<div id="container">


<div id="hud">

<div>🦝 NEXUS</div>

<div>
SCORE:
<span id="score">0</span>
</div>

<div>
HIGH:
<span id="high">0</span>
</div>

<div>
❤️
<span id="lives">3</span>
</div>

<div>
🍕
<span id="pizza">0</span>/3
</div>

<div id="status">
READY
</div>

</div>


<canvas
id="game"
width="480"
height="270">
</canvas>


<div id="controls">

JOYSTICK LEFT / RIGHT

&nbsp; | &nbsp;

CENTER = START / RESET / PAUSE

&nbsp; | &nbsp;

D1 = JUMP / LASER

&nbsp; | &nbsp;

D4 = FLY

</div>


</div>


<div id="message"></div>


<script>


// =====================================================
// CANVAS
// =====================================================

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;


// =====================================================
// CONTROLLER
// =====================================================

let input={

direction:"CENTER",

jump:false,

fly:false,

reset:false,

pause:false

};


let previous={

jump:false,

fly:false,

reset:false,

pause:false

};


// =====================================================
// GAME STATE
// =====================================================

let state="START";

let score=0;

let lives=3;

let pizzaCount=0;

let highScore=

Number(
localStorage.getItem("nexusHighScore") || 0
);

let cameraX=0;

let flightUnlocked=false;

let flying=false;

let flightTime=0;


// =====================================================
// SOUND
// =====================================================

let audioContext=null;


function beep(

frequency=600,

duration=0.08

){

try{

audioContext=

audioContext ||

new(
window.AudioContext ||
window.webkitAudioContext
)();

let oscillator=
audioContext.createOscillator();

let gain=
audioContext.createGain();

oscillator.type="square";

oscillator.frequency.value=
frequency;

gain.gain.value=0.035;

oscillator.connect(gain);

gain.connect(audioContext.destination);

oscillator.start();

gain.gain.exponentialRampToValueAtTime(

0.001,

audioContext.currentTime+
duration

);

oscillator.stop(

audioContext.currentTime+
duration

);

}

catch(e){}

}


// =====================================================
// ESP8266 CONTROLLER
// =====================================================

async function readController(){

try{

/*
If this website is deployed on Vercel,
there is no ESP8266 server at the same URL.

Therefore controller input is disabled
when running on Vercel.

The game still works normally.
*/

return;

}

catch(error){

}

}


setInterval(

readController,

70

);


// =====================================================
// BUTTON EDGE
// =====================================================

function pressed(button){

return (

input[button] === true &&

previous[button] !== true

);

}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text){

let message=

document.getElementById("message");

message.innerHTML=text;

message.style.display="block";

}


function hideMessage(){

document.getElementById("message")
.style.display="none";

}


// =====================================================
// PLAYER
// =====================================================

let player={

x:45,

y:100,

width:22,

height:30,

vx:0,

vy:0,

onGround:false

};


// =====================================================
// PLATFORMS
// =====================================================

const platforms=[

{x:0,y:235,w:220,h:35},

{x:255,y:210,w:130,h:60},

{x:420,y:190,w:130,h:80},

{x:590,y:220,w:140,h:50},

{x:770,y:180,w:140,h:90},

{x:950,y:210,w:140,h:60},

{x:1130,y:185,w:150,h:85},

{x:1320,y:215,w:140,h:55},

{x:1500,y:175,w:160,h:95},

{x:1700,y:210,w:150,h:60},

{x:1880,y:180,w:180,h:90}

];


// =====================================================
// COINS
// =====================================================

let coins=[];

for(

let i=0;

i<36;

i++

){

coins.push({

x:80+i*55,

y:145-(i%4)*18,

collected:false

});

}


// =====================================================
// PIZZAS
// =====================================================

let pizzas=[

{x:300,y:175,collected:false},

{x:690,y:185,collected:false},

{x:1030,y:175,collected:false},

{x:1370,y:180,collected:false},

{x:1550,y:140,collected:false},

{x:1900,y:145,collected:false}

];


// =====================================================
// ENEMIES
// =====================================================

let enemies=[

{

x:650,

y:185,

width:18,

height:25,

vx:0.45

},

{

x:1200,

y:175,

width:18,

height:25,

vx:-0.5

}

];


// =====================================================
// COLLISION
// =====================================================

function collision(a,b){

return(

a.x < b.x+b.width &&

a.x+a.width > b.x &&

a.y < b.y+b.height &&

a.y+a.height > b.y

);

}


// =====================================================
// START / RESET
// =====================================================

function resetGame(){

state="PLAYING";

score=0;

lives=3;

pizzaCount=0;

flightUnlocked=false;

flying=false;

flightTime=0;

cameraX=0;

player.x=45;

player.y=100;

player.vx=0;

player.vy=0;

player.onGround=false;


coins.forEach(

coin=>coin.collected=false

);


pizzas.forEach(

pizza=>pizza.collected=false

);


enemies=[

{

x:650,

y:185,

width:18,

height:25,

vx:0.45

},

{

x:1200,

y:175,

width:18,

height:25,

vx:-0.5

}

];


hideMessage();

beep(700,0.1);

updateHUD();

}


// =====================================================
// GAME OVER
// =====================================================

function gameOver(){

if(score>highScore){

highScore=score;

localStorage.setItem(

"nexusHighScore",

highScore

);

}

state="GAMEOVER";

updateHUD();

showMessage(

"💀 GAME OVER<br><br>"+

"SCORE: "+score+

"<br>"+

"HIGH SCORE: "+highScore+

"<br><br>"+

"CENTER BUTTON = RESET"

);

}


// =====================================================
// PLAYER HIT
// =====================================================

function hitPlayer(){

if(flying){

return;

}

lives--;

beep(150,0.15);

if(lives<=0){

gameOver();

return;

}

player.x-=120;

if(player.x<45){

player.x=45;

}

player.y=100;

player.vx=0;

player.vy=0;

updateHUD();

}


// =====================================================
// UPDATE
// =====================================================

function update(){


// -----------------------------------------------------
// KEYBOARD / MOUSE / TOUCH CONTROLS
// -----------------------------------------------------

if(

keys["ArrowLeft"] ||

keys["a"] ||

keys["A"]

){

input.direction="LEFT";

}

else if(

keys["ArrowRight"] ||

keys["d"] ||

keys["D"]

){

input.direction="RIGHT";

}

else{

input.direction="CENTER";

}


// -----------------------------------------------------
// CENTER BUTTON / RESET
// -----------------------------------------------------

if(pressed("reset")){

if(state==="PAUSED"){

state="PLAYING";

hideMessage();

beep(700,0.08);

}

else if(

state==="GAMEOVER" ||

state==="VICTORY"

){

resetGame();

}

else if(state==="START"){

resetGame();

}

else{

state="PAUSED";

showMessage(

"⏸ PAUSED<br><br>"+

"PRESS SPACE TO RESUME"

);

beep(400,0.08);

}

previous=
Object.assign({},input);

return;

}


// -----------------------------------------------------
// START SCREEN
// -----------------------------------------------------

if(state==="START"){

if(

pressed("fly") ||

pressed("jump") ||

keys["Enter"] ||

keys[" "]

){

resetGame();

}

previous=
Object.assign({},input);

return;

}


// -----------------------------------------------------
// GAME OVER / VICTORY
// -----------------------------------------------------

if(

state==="GAMEOVER" ||

state==="VICTORY"

){

previous=
Object.assign({},input);

return;

}


// -----------------------------------------------------
// PAUSED
// -----------------------------------------------------

if(state==="PAUSED"){

previous=
Object.assign({},input);

return;

}


// =====================================================
// MOVEMENT
// =====================================================

if(

input.direction==="LEFT"

){

player.vx=-1.6;

}

else if(

input.direction==="RIGHT"

){

player.vx=1.6;

}

else{

player.vx*=0.78;

}


// =====================================================
// FLY
// =====================================================

if(

pressed("fly") &&

flightUnlocked &&

!flying

){

flying=true;

flightTime=900;

beep(850,0.1);

}


if(flying){

flightTime-=16;

player.vy=-0.25;

if(

input.direction==="RIGHT"

){

player.vx=2;

}

else if(

input.direction==="LEFT"

){

player.vx=-2;

}

if(

flightTime<=0

){

flying=false;

flightTime=0;

beep(250,0.1);

}

}

else{

player.vy+=0.45;

}


// =====================================================
// JUMP
// =====================================================

if(

pressed("jump") &&

player.onGround &&

!flying

){

player.vy=-8;

beep(500,0.08);

}


// =====================================================
// POSITION
// =====================================================

player.x+=player.vx;

player.y+=player.vy;


// =====================================================
// PLATFORM COLLISION
// =====================================================

player.onGround=false;

if(!flying){

for(

const platform of platforms

){

if(

player.x <
platform.x+platform.w &&

player.x+player.width >
platform.x &&

player.y+player.height >=
platform.y &&

player.y+player.height <=
platform.y+18 &&

player.vy>=0

){

player.y=
platform.y-player.height;

player.vy=0;

player.onGround=true;

}

}

}


// =====================================================
// COINS
// =====================================================

for(

const coin of coins

){

if(!coin.collected){

if(

collision(

player,

{

x:coin.x,

y:coin.y,

width:12,

height:12

}

)

){

coin.collected=true;

score+=25;

beep(900,0.035);

}

}

}


// =====================================================
// PIZZAS
// =====================================================

for(

const pizza of pizzas

){

if(!pizza.collected){

if(

collision(

player,

{

x:pizza.x,

y:pizza.y,

width:16,

height:14

}

)

){

pizza.collected=true;

pizzaCount++;

score+=150;

beep(1100,0.08);

if(pizzaCount>=3){

flightUnlocked=true;

beep(1300,0.15);

}

}

}

}


// =====================================================
// ENEMIES
// =====================================================

for(

const enemy of enemies

){

enemy.x+=enemy.vx;

if(enemy.x<500){

enemy.vx=
Math.abs(enemy.vx);

}

if(enemy.x>1900){

enemy.vx=
-Math.abs(enemy.vx);

}

if(

collision(

player,

{

x:enemy.x,

y:enemy.y,

width:enemy.width,

height:enemy.height

}

) &&

!flying

){

hitPlayer();

}

}


// =====================================================
// FALL
// =====================================================

if(player.y>330){

hitPlayer();

}


// =====================================================
// CAMERA
// =====================================================

cameraX=

Math.max(

0,

player.x-110

);


// =====================================================
// FINISH
// =====================================================

if(player.x>1980){

state="VICTORY";

if(score>highScore){

highScore=score;

localStorage.setItem(

"nexusHighScore",

highScore

);

}

beep(1200,0.25);

showMessage(

"🏆 VICTORY!<br><br>"+

"NEXUS RACCOON FINISHED!"+

"<br><br>"+

"SCORE: "+score+

"<br>"+

"HIGH SCORE: "+highScore+

"<br><br>"+

"PRESS ENTER TO RESET"

);

}


// =====================================================
// SAVE BUTTON STATE
// =====================================================

previous=
Object.assign({},input);

updateHUD();

}


// =====================================================
// KEYBOARD CONTROLS
// =====================================================

let keys={};


document.addEventListener(

"keydown",

function(event){

keys[event.key]=true;


// SPACE = JUMP

if(

event.key===" " &&

!event.repeat

){

input.jump=true;

}


// ENTER = RESET / START

if(

event.key==="Enter" &&

!event.repeat

){

input.reset=true;

}

});



document.addEventListener(

"keyup",

function(event){

keys[event.key]=false;


if(event.key===" "){

input.jump=false;

}


if(event.key==="Enter"){

input.reset=false;

}

});


// =====================================================
// TOUCH / MOBILE CONTROLS
// =====================================================

canvas.addEventListener(

"touchstart",

function(event){

event.preventDefault();

let touch=
event.touches[0];

let rect=
canvas.getBoundingClientRect();

let x=
touch.clientX-rect.left;

if(x<rect.width/3){

input.direction="LEFT";

}

else if(x>rect.width*2/3){

input.direction="RIGHT";

}

else{

input.jump=true;

}

},
{passive:false}
);


canvas.addEventListener(

"touchend",

function(event){

event.preventDefault();

input.direction="CENTER";

input.jump=false;

},
{passive:false}
);


// =====================================================
// HUD
// =====================================================

function updateHUD(){

document.getElementById("score")
.textContent=score;

document.getElementById("high")
.textContent=highScore;

document.getElementById("lives")
.textContent=lives;

document.getElementById("pizza")
.textContent=pizzaCount;

if(state==="PLAYING"){

document.getElementById("status")
.textContent=

flying ? "FLYING" :

flightUnlocked ?
"FLIGHT READY" :
"PLAYING";

}

else{

document.getElementById("status")
.textContent=state;

}

}


// =====================================================
// BACKGROUND
// =====================================================

function drawBackground(){

let environment=

Math.floor(player.x/500);


// SKY
// -----------------------------------------------------

if(environment===0){

ctx.fillStyle="#65c9ff";

ctx.fillRect(

0,0,480,270

);

ctx.fillStyle="#ffe76a";

ctx.fillRect(

390,25,35,35

);

ctx.fillStyle="#ffffff";

for(

let i=0;

i<4;

i++

){

ctx.fillRect(

50+i*120,

55+(i%2)*25,

45,

12

);

}

ctx.fillStyle="#4c9d4a";

ctx.fillRect(

0,225,480,45

);

}


// SPACE
// -----------------------------------------------------

else if(environment===1){

ctx.fillStyle="#182c55";

ctx.fillRect(

0,0,480,270

);

ctx.fillStyle="#ffffff";

for(

let i=0;

i<25;

i++

){

ctx.fillRect(

(i*83)%480,

(i*47)%200,

3,

3

);

}

ctx.fillStyle="#4c80c4";

ctx.fillRect(

0,225,480,45

);

}


// MOON
// -----------------------------------------------------

else if(environment===2){

ctx.fillStyle="#171329";

ctx.fillRect(

0,0,480,270

);

ctx.fillStyle="#ddd";

ctx.fillRect(

365,30,55,55

);

ctx.fillStyle="#777";

ctx.fillRect(

375,42,10,10

);

ctx.fillRect(

400,65,9,9

);

ctx.fillStyle="#555";

ctx.fillRect(

0,225,480,45

);

}


// VOLCANO
// -----------------------------------------------------

else{

ctx.fillStyle="#32151d";

ctx.fillRect(

0,0,480,270

);

ctx.fillStyle="#6d2525";

for(

let i=0;

i<8;

i++

){

ctx.fillRect(

i*70,

145-(i%2)*20,

35,

80

);

}

ctx.fillStyle="#ff592d";

ctx.fillRect(

0,220,480,50

);

}

}


// =====================================================
// PLATFORMS
// =====================================================

function drawPlatforms(){

for(

const platform of platforms

){

let x=

platform.x-cameraX;

ctx.fillStyle="#583a2b";

ctx.fillRect(

x,

platform.y,

platform.w,

platform.h

);

ctx.fillStyle="#5fba55";

ctx.fillRect(

x,

platform.y,

platform.w,

7

);

}

}


// =====================================================
// COINS
// =====================================================

function drawCoins(){

for(

const coin of coins

){

if(!coin.collected){

let x=

coin.x-cameraX;

ctx.fillStyle="#ffd83d";

ctx.fillRect(

x,

coin.y,

12,

12

);

ctx.fillStyle="#fff5a3";

ctx.fillRect(

x+3,

coin.y+2,

3,

6

);

}

}

}


// =====================================================
// PIZZAS
// =====================================================

function drawPizzas(){

for(

const pizza of pizzas

){

if(!pizza.collected){

let x=

pizza.x-cameraX;

ctx.fillStyle="#d99032";

ctx.fillRect(

x,

pizza.y,

16,

12

);

ctx.fillStyle="#ffe66d";

ctx.fillRect(

x+2,

pizza.y+2,

12,

8

);

ctx.fillStyle="#e5483e";

ctx.fillRect(

x+5,

pizza.y+3,

3,

3

);

}

}

}


// =====================================================
// ENEMIES
// =====================================================

function drawEnemies(){

for(

const enemy of enemies

){

let x=

enemy.x-cameraX;

ctx.fillStyle="#9b3aa3";

ctx.fillRect(

x,

enemy.y,

18,

25

);

ctx.fillStyle="#ffe66d";

ctx.fillRect(

x+3,

enemy.y+5,

4,

4

);

ctx.fillRect(

x+11,

enemy.y+5,

4,

4

);

}

}


// =====================================================
// PLAYER
// =====================================================

function drawPlayer(){

let x=

player.x-cameraX;

let y=

player.y;


// TAIL

ctx.fillStyle="#765139";

ctx.fillRect(

x-10,

y+10,

10,

17

);

ctx.fillStyle="#ddd";

ctx.fillRect(

x-10,

y+16,

10,

5

);


// BODY

ctx.fillStyle="#888";

ctx.fillRect(

x+2,

y+9,

18,

18

);


// BACKPACK

ctx.fillStyle="#b96e35";

ctx.fillRect(

x+14,

y+9,

10,

15

);

ctx.fillStyle="#ffe36b";

ctx.fillRect(

x+17,

y+14,

4,

4

);


// HEAD

ctx.fillStyle="#999";

ctx.fillRect(

x+2,

y,

22,

15

);


// EARS

ctx.fillRect(

x+2,

y-5,

7,

7

);

ctx.fillRect(

x+17,

y-5,

7,

7

);


// MASK

ctx.fillStyle="#333";

ctx.fillRect(

x+3,

y+5,

20,

7

);


// EYES

ctx.fillStyle="#ffe66d";

ctx.fillRect(

x+7,

y+6,

4,

4

);

ctx.fillRect(

x+16,

y+6,

4,

4

);


// NOSE

ctx.fillStyle="#222";

ctx.fillRect(

x+12,

y+10,

4,

2

);


// LEGS

ctx.fillStyle="#666";

ctx.fillRect(

x+5,

y+25,

5,

7

);

ctx.fillRect(

x+15,

y+25,

5,

7

);


// FLYING EFFECT

if(flying){

ctx.fillStyle="#ffe66d";

ctx.fillRect(

x-5,

y+7,

3,

20

);

ctx.fillRect(

x+25,

y+7,

3,

20

);

}


// LASER

if(

flying &&

input.jump

){

ctx.fillStyle="#ff4040";

ctx.fillRect(

x+24,

y+9,

55,

4

);

ctx.fillStyle="#ffffff";

ctx.fillRect(

x+27,

y+10,

48,

2

);

}

}


// =====================================================
// START SCREEN
// =====================================================

function drawStart(){

ctx.fillStyle="#65c9ff";

ctx.fillRect(

0,0,480,270

);

ctx.fillStyle="#ffe76a";

ctx.fillRect(

380,25,40,40

);

ctx.fillStyle="#fff";

ctx.font=
"bold 30px monospace";

ctx.fillText(

"NEXUS RACCOON",

105,

75

);

ctx.font=
"14px monospace";

ctx.fillText(

"WEB ADVENTURE",

160,

100

);

ctx.font=
"16px monospace";

ctx.fillStyle="#ffe66d";

ctx.fillText(

"PRESS ENTER TO START",

125,

215

);

ctx.font=
"11px monospace";

ctx.fillStyle="#fff";

ctx.fillText(

"ARROW KEYS TO MOVE • SPACE TO JUMP",

115,

238

);

}


// =====================================================
// DRAW
// =====================================================

function draw(){

if(state==="START"){

drawStart();

return;

}

drawBackground();

drawPlatforms();

drawCoins();

drawPizzas();

drawEnemies();

drawPlayer();

ctx.fillStyle="#fff";

ctx.font=
"12px monospace";

ctx.fillText(

"NEXUS ZONE",

10,

20

);

}


// =====================================================
// MAIN LOOP
// =====================================================

function gameLoop(){

update();

draw();

requestAnimationFrame(gameLoop);

}


updateHUD();

gameLoop();


</script>

</body>

</html>
